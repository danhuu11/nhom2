<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập & Đăng ký</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    body {
      background: #f8f9fa;
      font-family: 'Roboto', sans-serif;
    }
    .card {
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .btn-custom {
      background-color: #007bff;
      color: white;
    }
    .btn-custom:hover {
      background-color: #0056b3;
      color: white;
    }
    .form-container {
      margin-top: 60px;
    }
    .nav-tabs .nav-link.active {
      background-color: #007bff;
      color: white;
      border-radius: 10px 10px 0 0;
    }
  </style>
</head>
<body>

<div class="container form-container">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-body">

          <!-- Tabs -->
          <ul class="nav nav-tabs mb-4" id="formTabs" role="tablist">
            <li class="nav-item">
              <a class="nav-link active" id="login-tab" data-toggle="tab" href="#login" role="tab">Đăng nhập</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" id="register-tab" data-toggle="tab" href="#register" role="tab">Đăng ký</a>
            </li>
          </ul>

          <!-- Nội dung tab -->
          <div class="tab-content" id="formTabsContent">

            <!-- Đăng nhập -->
            <div class="tab-pane fade show active" id="login" role="tabpanel">
              <form action="index.php?controller=user&action=dangnhap" method="POST">
                <div class="form-group">
                  <label for="loginEmail">Email</label>
                  <input type="email" class="form-control" name="email" placeholder="Nhập email" required>
                </div>
                <div class="form-group">
                  <label for="loginPassword">Mật khẩu</label>
                  <input type="password" class="form-control" name="password" placeholder="Nhập mật khẩu" required>
                </div>
                <button type="submit" class="btn btn-custom btn-block">Đăng nhập</button>
              </form>
            </div>

            <!-- Đăng ký -->
            <div class="tab-pane fade" id="register" role="tabpanel">
              <form action="index.php?controller=user&action=dangky" method="POST">
                <div class="form-group">
                  <label for="registerName">Họ và tên</label>
                  <input type="text" class="form-control" name="fullname" placeholder="Nhập họ và tên" required>
                </div>
                <div class="form-group">
                  <label for="registerEmail">Email</label>
                  <input type="email" class="form-control" name="email" placeholder="Nhập email" required>
                </div>
                <div class="form-group">
                  <label for="registerPassword">Mật khẩu</label>
                  <input type="password" class="form-control" name="password" placeholder="Nhập mật khẩu" required>
                </div>
                <div class="form-group">
                  <label for="registerConfirmPassword">Nhập lại mật khẩu</label>
                  <input type="password" class="form-control" name="confirm_password" placeholder="Nhập lại mật khẩu" required>
                </div>
                <button type="submit" class="btn btn-custom btn-block">Đăng ký</button>
              </form>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- JS Bootstrap -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
